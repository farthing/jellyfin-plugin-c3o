<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- C-3.o plugin image: a gold speech bubble holding the name and two caption lines.
       Source for c3o.png (render with render.ps1). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1f52"/>
      <stop offset="0.55" stop-color="#17223f"/>
      <stop offset="1" stop-color="#062c3d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="0.5" stop-color="#f2b632"/>
      <stop offset="1" stop-color="#cf8f12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- bubble with a tail at the lower left -->
  <path filter="url(#shadow)" fill="url(#gold)" d="M470,150 H1450 a90,90 0 0 1 90,90 V640 a90,90 0 0 1 -90,90
    H760 L560,890 L610,730 H470 a90,90 0 0 1 -90,-90 V240 a90,90 0 0 1 90,-90 Z"/>

  <text x="960" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="300" font-weight="800"
        text-anchor="middle" fill="#1d1506">C-3.o</text>

  <!-- two caption lines with the word "subtitles" between them -->
  <rect x="610" y="492" width="700" height="40" rx="20" fill="#1d1506" opacity="0.85"/>
  <text x="968" y="606" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700"
        letter-spacing="16" text-anchor="middle" fill="#1d1506">SUBTITLES</text>
  <rect x="730" y="636" width="460" height="40" rx="20" fill="#1d1506" opacity="0.85"/>

  <!-- language tags -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" text-anchor="middle" fill="#ffe07a">
    <g fill="none" stroke="#ffe07a" stroke-width="5">
      <rect x="850" y="880" width="150" height="90" rx="45"/>
      <rect x="1030" y="880" width="150" height="90" rx="45"/>
      <rect x="1210" y="880" width="150" height="90" rx="45"/>
      <rect x="1390" y="880" width="150" height="90" rx="45"/>
    </g>
    <text x="925" y="943">EN</text>
    <text x="1105" y="943">ES</text>
    <text x="1285" y="943">FR</text>
    <text x="1465" y="943">DE</text>
  </g>
</svg>
